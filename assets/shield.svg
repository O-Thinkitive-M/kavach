<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Kavach shield">
  <title>Kavach</title>
  <!-- Concentric rings, outermost first. Each disc paints over the one before. -->
  <circle cx="256" cy="256" r="255" fill="#ED1C24"/>
  <circle cx="256" cy="256" r="198" fill="#FFFFFF"/>
  <circle cx="256" cy="256" r="143" fill="#ED1C24"/>
  <circle cx="256" cy="256" r="88"  fill="#282776"/>
  <!-- Five-point star, apex up: outer radius 81, inner radius 32. -->
  <polygon fill="#FFFFFF"
           points="256.0,175.0 274.8,230.1 333.0,231.0 286.4,265.9 303.6,321.5 256.0,288.0 208.4,321.5 225.6,265.9 179.0,231.0 237.2,230.1"/>
</svg>
